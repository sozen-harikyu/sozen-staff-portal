<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタッフ業務ポータル｜株式会社宗前堂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #FDF9F6;
      --card-white: #FFFFFF;
      --rose-header-1: #D9A79C;
      --rose-header-2: #CFA095;
      --rose-accent: #C98276;
      --rose-deep: #B56E63;
      --sage-accent: #6E9E8B;
      --sage-soft: #E9F3EE;
      --blush-soft: #F7EAE6;
      --cream-soft: #FBF4E8;
      --blue-soft: #EAF2FA;
      --blue-accent: #5C89B5;
      --text-main: #4A3E3A;
      --text-sub: #8A7B75;
      --border-soft: #EFE6E1;
      --shadow-soft: 0 6px 20px rgba(122, 95, 86, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", sans-serif;
      background-color: var(--bg-ivory);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(235, 214, 206, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(211, 228, 216, 0.35) 0%, transparent 42%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.55;
      padding-bottom: 52px;
      -webkit-tap-highlight-color: transparent;
    }

    /* 画面切り替え制御 */
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
      animation: fadeIn 0.22s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 共通コンテナ */
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ===== メインメニュー画面 ===== */
    .portal-header {
      background: linear-gradient(135deg, var(--rose-header-1) 0%, var(--rose-header-2) 100%);
      color: #FFFFFF;
      text-align: center;
      padding: 20px 16px 22px;
      border-radius: 0 0 28px 28px;
      box-shadow: 0 6px 18px rgba(197, 145, 134, 0.25);
      margin-bottom: 18px;
    }

    .portal-header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .portal-header .sub {
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0.92;
      margin-top: 3px;
      letter-spacing: 0.08em;
    }

    /* キャラクター＆日付エリア */
    .hero-card {
      background: var(--card-white);
      border: 1.5px solid var(--border-soft);
      border-radius: 26px;
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-soft);
    }

    .hero-char-wrap {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: linear-gradient(145deg, #F9EFEA 0%, #F3E3DC 100%);
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(181, 110, 99, 0.14);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 4px 4px 0;
    }

    .hero-char {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }

    .hero-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-balloon {
      position: relative;
      background: var(--cream-soft);
      border: 1px solid #F2E4CE;
      color: var(--text-main);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.48;
    }

    .hero-balloon::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-right: 8px solid var(--cream-soft);
      border-bottom: 6px solid transparent;
    }

    .today-chip {
      background: var(--blush-soft);
      color: #6B534D;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.77rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* 2列メニューグリッド */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-bottom: 18px;
    }

    .menu-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      border-radius: 24px;
      padding: 16px 12px 15px;
      min-height: 138px;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      box-shadow: var(--shadow-soft);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      overflow: visible;
      font-family: inherit;
    }

    .menu-card:active {
      transform: scale(0.97);
    }

    .menu-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(74, 62, 58, 0.08);
      color: #5C4E49;
    }

    .icon-circle svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-title-text {
      font-size: 0.94rem;
      font-weight: 700;
      line-height: 1.28;
      text-align: left;
    }

    .menu-desc {
      font-size: 0.72rem;
      color: #5D504B;
      font-weight: 500;
      line-height: 1.42;
    }

    /* 大人可愛い・くすみパステル 7色テーマ（すべて別色） */
    .theme-sage     { background: #D3E4D8; border-color: #C3D9C9; }
    .theme-honey    { background: #F6E5C3; border-color: #ECD6AB; }
    .theme-babyblue { background: #D6E6F4; border-color: #C2D9EE; }
    .theme-peach    { background: #F6D8CE; border-color: #EBC4B8; }
    .theme-lilac    { background: #E6DCF3; border-color: #D7C8EC; }
    .theme-aqua     { background: #CEE6EA; border-color: #B9DAE0; }
    .theme-milktea  { background: #E6D3C9; border-color: #D9C0B4; }

    /* 丸バッジ（例：Q&Aが見れるよ！） */
    .badge-circle {
      position: absolute;
      top: -10px;
      right: -6px;
      background: #E08377;
      color: #FFFFFF;
      font-size: 0.63rem;
      font-weight: 700;
      line-height: 1.15;
      padding: 6px;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 3px 10px rgba(224, 131, 119, 0.35);
      transform: rotate(8deg);
      border: 1.5px solid #FFFFFF;
    }

    /* リボンタグ（例：ハブ） */
    .ribbon-tag {
      position: absolute;
      top: 9px;
      right: 9px;
      background: #7FAAC2;
      color: #FFFFFF;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      letter-spacing: 0.04em;
    }

    /* 横幅いっぱいのカード（7枠目：契約書フォーム） */
    .menu-card.full-width {
      grid-column: 1 / -1;
      min-height: 86px;
      padding: 14px 18px;
    }

    .menu-card.full-width .menu-header-row {
      margin-bottom: 4px;
    }

    /* ===== サブ画面（シフト＆質問箱）共通ヘッダー ===== */
    .sub-header {
      background: linear-gradient(135deg, var(--rose-header-1) 0%, var(--rose-header-2) 100%);
      color: #FFFFFF;
      padding: 14px 16px 18px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 4px 14px rgba(197, 145, 134, 0.22);
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .sub-header-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .sub-header-title {
      font-size: 1.02rem;
      font-weight: 700;
    }

    /* ===== シフト画面パーツ ===== */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 13px 10px;
      border-radius: 20px;
      line-height: 1.35;
      box-shadow: 0 4px 12px rgba(74, 62, 58, 0.08);
    }

    .btn-shift-req { background: linear-gradient(135deg, #DFA397 0%, #C98276 100%); }
    .btn-work-rep  { background: linear-gradient(135deg, #86B3A1 0%, #6E9E8B 100%); }

    .today-pickup {
      background: #FFFFFF;
      border: 1.5px solid #E5B9AF;
      border-radius: 22px;
      padding: 14px 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
    }

    .today-pickup-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .today-pickup-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--rose-deep);
    }

    .jump-today-btn {
      background: var(--cream-soft);
      color: #8C6A3E;
      border: 1px solid #EAD7B7;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .pickup-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pickup-chip {
      background: var(--bg-ivory);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .control-panel {
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      padding: 13px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-soft);
    }

    .month-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1.5px dashed var(--border-soft);
    }

    .month-tab {
      flex: 1;
      background: var(--bg-ivory);
      color: var(--text-sub);
      border: 1.5px solid var(--border-soft);
      padding: 7px 10px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }

    .month-tab.active {
      background: var(--rose-accent);
      color: #FFFFFF;
      border-color: var(--rose-accent);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .staff-select {
      flex: 1;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-ivory);
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      outline: none;
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 10px;
      font-size: 0.76rem;
      color: var(--text-sub);
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }

    .day-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 13px 15px;
      margin-bottom: 10px;
      box-shadow: 0 3px 10px rgba(122, 95, 86, 0.04);
    }

    .day-card.today-card {
      border-color: var(--rose-accent);
      background: #FFFDFB;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--border-soft);
    }

    .day-title {
      font-size: 0.96rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .dow-badge {
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 8px;
      background: var(--bg-ivory);
      color: var(--text-sub);
    }
    .dow-sat { background: var(--blue-soft); color: var(--blue-accent); }
    .dow-sun { background: var(--blush-soft); color: var(--rose-deep); }

    .holiday-badge {
      background: var(--blush-soft);
      color: var(--rose-deep);
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .today-pill {
      background: var(--rose-accent);
      color: #FFFFFF;
      font-size: 0.66rem;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .shift-pills {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .shift-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .pill-allday { background: var(--blush-soft); color: var(--rose-deep); }
    .pill-time   { background: var(--sage-soft); color: var(--sage-accent); }

    .pill-time-text {
      background: rgba(255, 255, 255, 0.88);
      padding: 2px 9px;
      border-radius: 9px;
      font-size: 0.78rem;
    }

    .handover-box {
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      padding: 15px;
      margin-top: 16px;
      box-shadow: var(--shadow-soft);
    }

    .handover-item {
      background: var(--bg-ivory);
      border-radius: 12px;
      padding: 9px 11px;
      margin-top: 8px;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .handover-meta {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--rose-deep);
      margin-bottom: 2px;
    }

    /* ===== 質問箱（Q&A）画面パーツ ===== */
    .qa-post-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #DFA397 0%, #C98276 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(201, 130, 118, 0.25);
    }

    .qa-search {
      width: 100%;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--border-soft);
      background: #FFFFFF;
      font-size: 0.86rem;
      font-family: inherit;
      margin-bottom: 10px;
      outline: none;
    }

    .qa-cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .qa-cat-tab {
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }

    .qa-cat-tab.active {
      background: var(--rose-accent);
      color: #FFFFFF;
      border-color: var(--rose-accent);
    }

    .qa-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(122, 95, 86, 0.04);
    }

    .qa-cat-badge {
      display: inline-block;
      background: var(--blush-soft);
      color: var(--rose-deep);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .qa-title {
      font-size: 0.94rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .qa-q-box {
      background: var(--sage-soft);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.82rem;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .qa-a-box {
      background: var(--cream-soft);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.82rem;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .qa-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .qa-like-btn {
      background: var(--cream-soft);
      color: #8C6A3E;
      border: 1px solid #EAD7B7;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .qa-link-btn {
      font-size: 0.76rem;
      color: var(--sage-accent);
      font-weight: 700;
      text-decoration: none;
    }

    .loading-msg {
      text-align: center;
      padding: 36px 12px;
      color: var(--text-sub);
      font-size: 0.86rem;
    }

    footer {
      text-align: center;
      margin-top: 26px;
      font-size: 0.73rem;
      color: var(--text-sub);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <!-- ==========================================
       画面1：統合メインメニュー
  ========================================== -->
  <section id="view-menu" class="view-section active">
    <header class="portal-header">
      <h1 id="portalTitle">🌸 スタッフ業務ポータル / 株式会社宗前堂</h1>
      <div class="sub" id="portalSubtitle">統合メニュー</div>
    </header>

    <div class="container">
      <!-- キャラクター＆日付 -->
      <div class="hero-card">
        <div class="hero-char-wrap">
          <img id="heroCharImg" src="" alt="そうぜん先生" class="hero-char">
        </div>
        <div class="hero-right">
          <div class="hero-balloon" id="heroMessage"></div>
          <div class="today-chip" id="todayDateChip">読み込み中...</div>
        </div>
      </div>

      <!-- メニューグリッド（設定から自動生成） -->
      <div class="menu-grid" id="menuGrid"></div>

      <footer>&copy; 株式会社宗前堂 All Rights Reserved.</footer>
    </div>
  </section>

  <!-- ==========================================
       画面2：シフト報告＆確認（アプリ内ビュー）
  ========================================== -->
  <section id="view-shift" class="view-section">
    <div class="sub-header">
      <div class="sub-header-inner">
        <button type="button" class="back-btn" onclick="switchView('menu')">← メニュー</button>
        <div class="sub-header-title">シフト確認＆勤務報告</div>
      </div>
    </div>

    <div class="container">
      <div class="action-grid">
        <a id="shiftReqLink" href="#" target="_blank" rel="noopener noreferrer" class="action-btn btn-shift-req">
          <span>シフト希望を<br>提出する</span>
        </a>
        <a id="workRepLink" href="#" target="_blank" rel="noopener noreferrer" class="action-btn btn-work-rep">
          <span>本日の勤務報告<br>をする</span>
        </a>
      </div>

      <div id="todayPickupBox" class="today-pickup" style="display:none;">
        <div class="today-pickup-top">
          <span id="todayPickupTitle" class="today-pickup-title">本日の出勤</span>
          <button type="button" class="jump-today-btn" onclick="jumpToToday()">今日へ移動 ↓</button>
        </div>
        <div id="todayPickupList" class="pickup-list"></div>
      </div>

      <div class="control-panel">
        <div class="month-tabs" id="monthTabs"></div>
        <div class="filter-row">
          <span style="font-size:0.78rem;font-weight:700;color:var(--text-sub);">表示スタッフ：</span>
          <select id="staffFilter" class="staff-select" onchange="renderShiftCards()">
            <option value="ALL">全員表示</option>
          </select>
        </div>
      </div>

      <div class="summary-bar">
        <div id="shiftSummaryText">読み込み中...</div>
        <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" id="hideEmptyDays" onchange="renderShiftCards()">
          <span>出勤なしの日を隠す</span>
        </label>
      </div>

      <div id="shiftListContainer">
        <div class="loading-msg">シフト表データを読み込み中...</div>
      </div>

      <div id="handoverSection" class="handover-box" style="display:none;">
        <div style="font-size:0.88rem;font-weight:700;">直近の業務連絡・引き継ぎ</div>
        <div id="handoverList"></div>
      </div>
    </div>
  </section>

  <!-- ==========================================
       画面3：質問箱＆みんなのQ&A（アプリ内ビュー）
  ========================================== -->
  <section id="view-qa" class="view-section">
    <div class="sub-header">
      <div class="sub-header-inner">
        <button type="button" class="back-btn" onclick="switchView('menu')">← メニュー</button>
        <div class="sub-header-title">質問箱＆みんなのQ&A</div>
      </div>
    </div>

    <div class="container">
      <a id="qaFormLink" href="#" target="_blank" rel="noopener noreferrer" class="qa-post-btn">
        新しく質問を投稿する（Googleフォーム）
      </a>

      <input type="text" id="qaSearchInput" class="qa-search" placeholder="キーワード検索（例：膝痛、めまい、受付...）" oninput="renderQaList()">

      <div class="qa-cat-tabs" id="qaCatTabs"></div>

      <div class="summary-bar">
        <div id="qaCountText">読み込み中...</div>
        <select id="qaSortSelect" class="staff-select" style="flex:0 0 auto;padding:4px 8px;font-size:0.76rem;" onchange="renderQaList()">
          <option value="newest">新着順</option>
          <option value="likes">参考になった順</option>
        </select>
      </div>

      <div id="qaListContainer">
        <div class="loading-msg">Q&Aデータを読み込み中...</div>
      </div>
    </div>
  </section>

  <script>
    /* =====================================================================
       ★ 設定エリア（文字・色・URL・順番はここを書き換えるだけで変更できます）
    ===================================================================== */
    const PORTAL_CONFIG = {
      title: '🌸 スタッフ業務ポータル / 株式会社宗前堂',
      subtitle: '統合メニュー',
      charImageUrl: 'https://lh3.googleusercontent.com/d/12kcwLZRB7KcRAFOu9vyfUsuF04-JXRap',
      charFallbackUrl: 'https://drive.google.com/uc?export=view&id=12kcwLZRB7KcRAFOu9vyfUsuF04-JXRap',
      greetingHtml: '何でも聞いて！😊<br>今日も1日よろしく<br>お願いします！',

      // ▼ 各GASのウェブアプリURL
      shiftGasApiUrl: 'https://script.google.com/macros/s/AKfycbzSbgK5i-4-iMkiUfL2h9NXz2yY-zwCUzfD1Lf0ED3qJybuN6b2PEP3np7dzHBkdg/exec?api=shift',
      qaGasApiUrl:    'https://script.google.com/macros/s/AKfycbzO1vGmgtZdwxoGoDYCL27v3OzXI0rMi0fYFG0RklSb02YJHGl1TIGalJrjGqHpQgZEWg/exec?api=qa',

      // ▼ 各GoogleフォームのURL
      shiftRequestFormUrl: 'https://forms.gle/jjhmaKu4WxCNJhw46',
      workReportFormUrl:   'https://forms.gle/NxR1FJdWaPKjGYoY8',
      qaPostFormUrl:       'https://forms.gle/KLvFeSAYJHRkM7Ja8'
    };

    // ▼ 線画SVGアイコン集（白丸バッジ内に表示）
    const ICONS = {
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
      calendar: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      clipboard: '<svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1H7V6a2 2 0 0 1 2-2z"/><rect x="5" y="5" width="14" height="16" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>',
      mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><polyline points="3 7 12 13 21 7"/></svg>',
      edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
      globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>',
      file: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>'
    };

    // ▼ メニューの並び順・文字・色（sage / honey / babyblue / peach / lilac / aqua / milktea）を自由に変更可能
    const MENU_ITEMS = [
      {
        id: 'attendance',
        title: '出退勤報告',
        desc: '出勤・退勤の打刻や報告はこちらから',
        icon: 'clock',
        color: 'sage',
        type: 'link',
        url: 'https://forms.gle/yXtCdmY4vJEv8BaR9'
      },
      {
        id: 'shift',
        title: 'シフト報告<br>＆確認',
        desc: '希望シフトの提出・確定シフト表の確認',
        icon: 'calendar',
        color: 'honey',
        type: 'view',
        targetView: 'shift'
      },
      {
        id: 'reservation',
        title: '銀座院<br>予約システム',
        desc: '銀座そうぜん鍼灸院の予約状況の確認・管理',
        icon: 'clipboard',
        color: 'babyblue',
        type: 'link',
        url: 'https://sozen-harikyu.github.io/sozen-reserve/'
      },
      {
        id: 'qa',
        title: '質問箱<br>（投稿＆回答）',
        desc: '施術・業務に関する疑問、相談の匿名投稿・回答',
        icon: 'mail',
        color: 'peach',
        badge: 'Q&Aが<br>見れるよ！',
        type: 'view',
        targetView: 'qa'
      },
      {
        id: 'case_report',
        title: '症例報告<br>フォーム',
        desc: 'ポータル掲載用の症例・治療経過の共有',
        icon: 'edit',
        color: 'lilac',
        type: 'link',
        url: 'https://forms.gle/9H7KfYXxdfS92bHJ6'
      },
      {
        id: 'group_portal',
        title: 'グループ<br>ポータルサイト',
        desc: '各種マニュアル、共有資料のトップへ移動',
        icon: 'globe',
        color: 'aqua',
        ribbon: 'ハブ',
        type: 'link',
        url: 'https://sozen-harikyu.github.io/sozen-portal/'
      },
      {
        id: 'contract',
        title: '契約書フォーム',
        desc: '各種契約や同意書の入力・提出はこちらから',
        icon: 'file',
        color: 'milktea',
        fullWidth: true,
        type: 'link',
        url: 'https://forms.gle/BAw6sWFAFVxfkHXV7'
      }
    ];

    /* =====================================================================
       アプリ本体ロジック
    ===================================================================== */
    let shiftMonthsData = [];
    let shiftHandovers = [];
    let shiftLoaded = false;
    let activeMonthIndex = 0;

    let qaAllItems = [];
    let qaLoaded = false;
    let activeQaCategory = 'すべて';

    window.addEventListener('DOMContentLoaded', () => {
      initMenu();
      updateTodayChip();
      document.getElementById('shiftReqLink').href = PORTAL_CONFIG.shiftRequestFormUrl;
      document.getElementById('workRepLink').href = PORTAL_CONFIG.workReportFormUrl;
      document.getElementById('qaFormLink').href = PORTAL_CONFIG.qaPostFormUrl;
    });

    function initMenu() {
      document.getElementById('portalTitle').textContent = PORTAL_CONFIG.title;
      document.getElementById('portalSubtitle').textContent = PORTAL_CONFIG.subtitle;
      document.getElementById('heroMessage').innerHTML = PORTAL_CONFIG.greetingHtml;

      const img = document.getElementById('heroCharImg');
      img.src = PORTAL_CONFIG.charImageUrl;
      img.onerror = () => { img.src = PORTAL_CONFIG.charFallbackUrl; };

      const grid = document.getElementById('menuGrid');
      grid.innerHTML = MENU_ITEMS.map(item => {
        const badgeHtml = item.badge ? `<span class="badge-circle">${item.badge}</span>` : '';
        const ribbonHtml = item.ribbon ? `<span class="ribbon-tag">${escapeHtml(item.ribbon)}</span>` : '';
        const widthCls = item.fullWidth ? ' full-width' : '';
        const iconSvg = ICONS[item.icon] || ICONS.file;
        const inner = `
          ${badgeHtml}
          ${ribbonHtml}
          <div class="menu-header-row">
            <span class="icon-circle">${iconSvg}</span>
            <span class="menu-title-text">${item.title}</span>
          </div>
          <div class="menu-desc">${escapeHtml(item.desc)}</div>
        `;

        if (item.type === 'view') {
          return `<button type="button" class="menu-card theme-${item.color}${widthCls}" onclick="switchView('${item.targetView}')">${inner}</button>`;
        } else {
          return `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="menu-card theme-${item.color}${widthCls}">${inner}</a>`;
        }
      }).join('');
    }

    function updateTodayChip() {
      const now = new Date();
      const dows = ['日', '月', '火', '水', '木', '金', '土'];
      const str = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日（${dows[now.getDay()]}）`;
      document.getElementById('todayDateChip').innerHTML =
        `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${str}</span>`;
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'instant' });

      if (viewName === 'shift' && !shiftLoaded) loadShiftData();
      if (viewName === 'qa' && !qaLoaded) loadQaData();
    }

    /* ----- シフト確認ロジック ----- */
    async function loadShiftData() {
      const container = document.getElementById('shiftListContainer');
      if (!PORTAL_CONFIG.shiftGasApiUrl.startsWith('http')) {
        container.innerHTML = '<div class="loading-msg">設定エリアにシフト管理GASのURLを設定してください。</div>';
        return;
      }
      try {
        const res = await fetch(PORTAL_CONFIG.shiftGasApiUrl);
        const data = await res.json();
        if (!data || data.status !== 'success' || !Array.isArray(data.months)) {
          container.innerHTML = '<div class="loading-msg">シフトデータを取得できませんでした。</div>';
          return;
        }
        shiftLoaded = true;
        shiftMonthsData = data.months;
        shiftHandovers = Array.isArray(data.handovers) ? data.handovers : [];

        const todayIso = getTodayIso();
        renderTodayPickup(todayIso);
        renderHandovers();

        const currentYm = todayIso.slice(0, 7);
        const idx = shiftMonthsData.findIndex(m => m.days.some(d => d.rawDate.startsWith(currentYm)));
        activeMonthIndex = idx >= 0 ? idx : 0;

        renderMonthTabs();
        updateStaffOptions();
        renderShiftCards();
      } catch (e) {
        container.innerHTML = '<div class="loading-msg">通信エラーが発生しました。GASの公開設定（全員）をご確認ください。</div>';
      }
    }

    function renderTodayPickup(todayIso) {
      let foundDay = null;
      for (const m of shiftMonthsData) {
        const f = m.days.find(d => d.rawDate === todayIso);
        if (f) { foundDay = f; break; }
      }
      const box = document.getElementById('todayPickupBox');
      if (!foundDay) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      document.getElementById('todayPickupTitle').textContent = `本日（${foundDay.date}・${foundDay.dow}）の出勤`;
      document.getElementById('todayPickupList').innerHTML = foundDay.shifts.length
        ? foundDay.shifts.map(s => `<span class="pickup-chip">${escapeHtml(s.staff)}：${escapeHtml(s.time)}</span>`).join('')
        : '<span class="pickup-chip">本日のシフト予定はありません</span>';
    }

    function jumpToToday() {
      const todayIso = getTodayIso();
      const idx = shiftMonthsData.findIndex(m => m.days.some(d => d.rawDate === todayIso));
      if (idx >= 0 && idx !== activeMonthIndex) {
        activeMonthIndex = idx;
        renderMonthTabs();
        updateStaffOptions();
        renderShiftCards();
      }
      setTimeout(() => {
        const el = document.getElementById('day-' + todayIso);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 80);
    }

    function renderHandovers() {
      const sec = document.getElementById('handoverSection');
      if (!shiftHandovers.length) { sec.style.display = 'none'; return; }
      sec.style.display = 'block';
      document.getElementById('handoverList').innerHTML = shiftHandovers.map(h => `
        <div class="handover-item">
          <div class="handover-meta">${escapeHtml(h.date)} ／ ${escapeHtml(h.staff)}</div>
          <div>${escapeHtml(h.note)}</div>
        </div>
      `).join('');
    }

    function renderMonthTabs() {
      document.getElementById('monthTabs').innerHTML = shiftMonthsData.map((m, idx) => `
        <button type="button" class="month-tab ${idx === activeMonthIndex ? 'active' : ''}" onclick="selectMonth(${idx})">${escapeHtml(m.label)}</button>
      `).join('');
    }

    function selectMonth(idx) {
      activeMonthIndex = idx;
      document.getElementById('staffFilter').value = 'ALL';
      renderMonthTabs();
      updateStaffOptions();
      renderShiftCards();
    }

    function updateStaffOptions() {
      const sel = document.getElementById('staffFilter');
      const names = (shiftMonthsData[activeMonthIndex] || {}).staffNames || [];
      sel.innerHTML = `<option value="ALL">全員表示（${names.length}名）</option>` +
        names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    }

    function renderShiftCards() {
      const current = shiftMonthsData[activeMonthIndex];
      if (!current) return;
      const selected = document.getElementById('staffFilter').value;
      const hideEmpty = document.getElementById('hideEmptyDays').checked;
      const todayIso = getTodayIso();
      let daysCnt = 0, allDayCnt = 0, partCnt = 0;

      const html = current.days.map(day => {
        const list = selected === 'ALL' ? day.shifts : day.shifts.filter(s => s.staff === selected);
        if (list.length > 0) {
          daysCnt++;
          if (selected !== 'ALL') {
            if (list[0].time.includes('終日')) allDayCnt++; else partCnt++;
          }
        }
        if (hideEmpty && list.length === 0) return '';

        const isToday = day.rawDate === todayIso;
        let dowCls = 'dow-badge';
        if (day.dow === '土') dowCls += ' dow-sat';
        if (day.dow === '日' || day.holiday) dowCls += ' dow-sun';

        const pills = list.length
          ? `<div class="shift-pills">${list.map(s => `
              <div class="shift-pill ${s.time.includes('終日') ? 'pill-allday' : 'pill-time'}">
                <span>${escapeHtml(s.staff)}</span>
                <span class="pill-time-text">${escapeHtml(s.time)}</span>
              </div>`).join('')}</div>`
          : '<div style="font-size:0.78rem;color:#B8ABA0;text-align:center;padding:4px 0;">予定なし</div>';

        return `
          <div id="day-${escapeHtml(day.rawDate)}" class="day-card ${isToday ? 'today-card' : ''}">
            <div class="day-header">
              <div class="day-title">
                <span>${escapeHtml(day.date)}</span>
                <span class="${dowCls}">${escapeHtml(day.dow)}</span>
                ${day.holiday ? `<span class="holiday-badge">${escapeHtml(day.holiday)}</span>` : ''}
                ${isToday ? '<span class="today-pill">本日</span>' : ''}
              </div>
              <div style="font-size:0.72rem;color:var(--text-sub);font-weight:700;">${list.length ? list.length + '名出勤' : ''}</div>
            </div>
            ${pills}
          </div>`;
      }).join('');

      document.getElementById('shiftSummaryText').textContent = selected === 'ALL'
        ? `稼働日数：${daysCnt}日`
        : `${selected}：出勤${daysCnt}日（終日${allDayCnt}・時間指定${partCnt}）`;
      document.getElementById('shiftListContainer').innerHTML = html || '<div class="loading-msg">該当する予定がありません🌱</div>';
    }

    /* ----- 質問箱（Q&A）ロジック ----- */
    async function loadQaData() {
      const container = document.getElementById('qaListContainer');
      if (!PORTAL_CONFIG.qaGasApiUrl.startsWith('http')) {
        container.innerHTML = '<div class="loading-msg">設定エリアに質問箱GASのURLを設定してください。</div>';
        return;
      }
      try {
        const res = await fetch(PORTAL_CONFIG.qaGasApiUrl);
        const data = await res.json();
        const items = Array.isArray(data) ? data : (data.items || data.data || []);
        qaLoaded = true;
        qaAllItems = items;
        renderQaCategories();
        renderQaList();
      } catch (e) {
        container.innerHTML = '<div class="loading-msg">Q&Aの読み込みに失敗しました。GASの公開設定をご確認ください。</div>';
      }
    }

    function renderQaCategories() {
      const cats = ['すべて', ...new Set(qaAllItems.map(i => i.category).filter(Boolean))];
      document.getElementById('qaCatTabs').innerHTML = cats.map(c => `
        <button type="button" class="qa-cat-tab ${c === activeQaCategory ? 'active' : ''}" onclick="selectQaCat('${escapeHtml(c)}')">${escapeHtml(c)}</button>
      `).join('');
    }

    function selectQaCat(cat) {
      activeQaCategory = cat;
      renderQaCategories();
      renderQaList();
    }

    function renderQaList() {
      const kw = (document.getElementById('qaSearchInput').value || '').trim().toLowerCase();
      const sort = document.getElementById('qaSortSelect').value;

      let list = qaAllItems.filter(item => {
        if (activeQaCategory !== 'すべて' && item.category !== activeQaCategory) return false;
        if (!kw) return true;
        const text = `${item.title || ''} ${item.detail || ''} ${item.answer || ''} ${item.category || ''}`.toLowerCase();
        return text.includes(kw);
      });

      if (sort === 'likes') {
        list = [...list].sort((a, b) => (Number(b.likes) || 0) - (Number(a.likes) || 0));
      } else {
        list = [...list].reverse();
      }

      document.getElementById('qaCountText').textContent = `表示中：${list.length}件のQ&A`;
      document.getElementById('qaListContainer').innerHTML = list.length ? list.map(item => `
        <div class="qa-card">
          ${item.category ? `<span class="qa-cat-badge">${escapeHtml(item.category)}</span>` : ''}
          <div class="qa-title">${escapeHtml(item.title || '無題の質問')}</div>
          <div class="qa-q-box"><strong>スタッフの質問：</strong>\n${escapeHtml(item.detail || '')}</div>
          <div class="qa-a-box"><strong>そうぜん先生の回答：</strong>\n${escapeHtml(item.answer || '')}</div>
          <div class="qa-footer">
            <div>
              ${item.material ? `<a href="${escapeHtml(item.material)}" target="_blank" class="qa-link-btn">資料を見る</a> ` : ''}
              ${item.refLink ? `<a href="${escapeHtml(item.refLink)}" target="_blank" class="qa-link-btn">参考リンク</a>` : ''}
            </div>
            <span class="qa-like-btn">参考になった！ ${Number(item.likes) || 0}</span>
          </div>
        </div>
      `).join('') : '<div class="loading-msg">該当するQ&Aが見つかりませんでした🌱</div>';
    }

    function getTodayIso() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
